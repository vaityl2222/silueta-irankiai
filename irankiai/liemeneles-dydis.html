<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* --- skaiciuokles sluoksnis, remiasi stilius.css tokenais --- */
.darbas{max-width:620px;margin:0 auto;padding:30px 20px 64px}

/* kalbu perjungiklis */
.kalbos{display:flex;gap:6px;margin-bottom:26px}
.kalbos button{
  font:inherit;font-size:.85rem;font-weight:700;letter-spacing:.04em;cursor:pointer;
  padding:7px 13px;border-radius:var(--r);border:1.5px solid var(--konturas);
  background:transparent;color:var(--tekstas-silpnas);transition:border-color .15s,color .15s;
}
.kalbos button:hover{border-color:var(--linijos);color:var(--tekstas)}
.kalbos button[aria-current="true"]{background:var(--ruda);border-color:var(--ruda);color:var(--siltas-smelis)}

.ivadas h1{font-size:clamp(1.75rem,4.6vw,2.6rem);margin-bottom:14px}
.ivadas .santrauka{color:var(--tekstas-silpnas);max-width:52ch}

.laukas{margin:26px 0}
.laukas label{display:block;font-weight:700;margin-bottom:4px}
.laukas .kaip{color:var(--tekstas-silpnas);font-size:.92rem;margin-bottom:10px;max-width:50ch}
.laukas .kaip ul{margin:6px 0 0;padding-left:18px}
.laukas .kaip li{margin-bottom:2px}
.ivestis{display:flex;align-items:center;gap:10px;max-width:260px}
.ivestis input{
  flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:13px 14px;border-radius:var(--r);
  border:1.5px solid var(--konturas);background:var(--pavirsius);color:var(--tekstas);
}
.ivestis input:focus{outline:none;border-color:var(--oranzine);box-shadow:0 0 0 3px color-mix(in srgb,var(--oranzine) 28%,transparent)}
.ivestis .vnt{color:var(--tekstas-silpnas);flex:none}
.klaida{color:#9C2415;font-size:.92rem;margin-top:8px;font-weight:500;max-width:52ch}
.laukas.bloga input{border-color:#9C2415}
@media (prefers-color-scheme:dark){.klaida{color:#F3907E}}

.mygtukas{
  font:inherit;font-weight:700;font-size:1.02rem;cursor:pointer;border:0;border-radius:var(--r);
  padding:15px 30px;background:var(--oranzine);color:var(--ant-akcento);
  transition:filter .15s,transform .1s;
}
.mygtukas:hover{filter:brightness(1.06)}
.mygtukas:active{transform:translateY(1px)}

/* --- rezultatas --- */
#rezultatas{margin-top:34px}
#rezultatas[hidden]{display:none}
.atsakymas{background:var(--ruda);color:#F3E7DC;border-radius:var(--r);padding:28px 26px}
.atsakymas .antraste{font-size:1.02rem;font-weight:300;color:var(--siltas-smelis);margin-bottom:10px}
/* margin pikseliais: 1em prie 74px srifto duotu 74px tarpa */
.atsakymas .dydis{font-size:clamp(3rem,13vw,4.6rem);font-weight:900;letter-spacing:-.03em;line-height:.95;color:var(--oranzine);margin:0}
.atsakymas .nuo-kur{margin-top:18px;font-weight:700;color:#fff}
.atsakymas .smulkiau{margin-top:10px;font-size:.96rem;color:#E2D3C6}

.pagrindinis-cta{
  display:inline-block;margin-top:20px;background:var(--oranzine);color:var(--ant-akcento);
  text-decoration:none;font-weight:700;padding:15px 28px;border-radius:var(--r);
}
.pagrindinis-cta:hover{filter:brightness(1.06)}

.bloke{margin-top:26px;padding:20px 22px;border-radius:var(--r);background:var(--smelis);color:#3E2B24}
.bloke h2{font-size:1.1rem;margin-bottom:8px}
.bloke p{font-size:.97rem}
.bloke p a{color:inherit;text-decoration:underline;text-decoration-color:var(--oranzine);text-underline-offset:3px;font-weight:600}
.bloke .antrinis-cta{
  display:inline-block;margin-top:14px;text-decoration:none;font-weight:700;font-size:.95rem;
  color:var(--ruda);border-bottom:2px solid var(--oranzine);padding-bottom:2px;
}
@media (prefers-color-scheme:dark){.bloke{color:var(--tekstas)}.bloke .antrinis-cta{color:var(--oranzine)}}

.seseriniai{margin-top:22px;border-left:3px solid var(--pudra);padding:4px 0 4px 16px}
.seseriniai p{font-size:.96rem;color:var(--tekstas-silpnas)}
.seseriniai strong{color:var(--tekstas)}

.nepavyko .atsakymas{background:var(--bordo-tamsus)}
.nepavyko .atsakymas .antraste{font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:12px}

.islyga{margin-top:30px;font-size:.88rem;color:var(--tekstas-silpnas);line-height:1.55;max-width:60ch}
.islyga strong{color:var(--tekstas)}
</style>

<header class="virsus">

        <span id="t-kr-kaip"></span>

  </form>

  <section id="rezultatas" hidden aria-live="polite"></section>

  <p class="islyga" id="t-islyga"></p>

</main>

<footer class="poraste">
  <div class="vidus">

/* ---------- kalba ---------- */

function kalbosKodas(){
  const k = (new URLSearchParams(location.search).get('k') || '').toLowerCase();
  return TEKSTAI[k] ? k : 'lt';
}
let K = kalbosKodas();
let T = TEKSTAI[K];
let N = NUORODOS[K];

/* ---------- statistika ----------
   Siunčiame tik tada, kai kas nors realiai apskaičiuoja dydį: suvestus matmenis
   ir gautą rezultatą. Vien puslapio atidarymas niekur nefiksuojamas.
   Jokio IP, slapuko ar lankytojo identifikatoriaus. Duomenys keliauja į Google
   formą, o iš jos - į lentelę. Jei siuntimas nepavyksta, skaičiuoklė veikia
   lygiai taip pat. */

const STATISTIKOS_FORMA = 'https://docs.google.com/forms/d/e/1FAIpQLSd8xI8BsS5OM-wKQLLr4kr3T4_C517q-g2izLsMpagpvZ-VhA/formResponse';
const STATISTIKOS_LAUKAS = 'entry.196700957';

/* Nesiunčiame iš bandymų: lokalaus failo, localhost ar kai adrese yra ?t=1.
   Taip testavimas neterš tikros statistikos. */
function skaiciuotiStatistika(){
  if (!STATISTIKOS_FORMA) return false;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return false;
  if (/^(localhost|127\.|192\.168\.|0\.0\.0\.0)/.test(location.hostname)) return false;
  if (new URLSearchParams(location.search).get('t') === '1') return false;
  return true;
}

function siustiStatistika(ivykis, d){
  if (!skaiciuotiStatistika()) return;
  try {
    d = d || {};
    const tuscias = (v) => (v === undefined || v === null) ? '' : String(v);
    const eilute = [
      ivykis,
      K,
      tuscias(d.po),
      tuscias(d.krutine),
      tuscias(d.dydis),
      tuscias(d.juosta),
      tuscias(d.kauselis),
      (document.referrer || '').slice(0, 80)
    ].join('|');
    const kunas = new URLSearchParams();
    kunas.append(STATISTIKOS_LAUKAS, eilute);
    fetch(STATISTIKOS_FORMA, {
      method: 'POST',
      mode: 'no-cors',
      body: kunas,
      keepalive: true
    }).catch(function(){});
  } catch (klaida) {
    /* statistika niekada neturi sustabdyti skaičiuoklės */
  }
}

/* ---------- skaičiavimas ---------- */

function juostosDydis(po){ return Math.round(po / 5) * 5; }

function kauselioDydis(skirtumas){
  for (const x of KAUSELIAI) if (skirtumas >= x.nuo && skirtumas < x.iki) return x.k;
  const p = KAUSELIAI[KAUSELIAI.length - 1];
  if (skirtumas === p.iki) return p.k;
  return null;
}

function seserinis(juosta, kauselis, kryptis){
  const jIdx = JUOSTOS.indexOf(juosta) + kryptis;
  const kIdx = SEKA.indexOf(kauselis) - kryptis;
  if (jIdx < 0 || jIdx >= JUOSTOS.length) return null;
  if (kIdx < 0 || kIdx >= SEKA.length) return null;
  const dydis = JUOSTOS[jIdx] + SEKA[kIdx];
  return FILTRAS[dydis] ? dydis : null;
}

function filtroNuoroda(dydis){
  const id = FILTRAS[dydis];
  return id ? N.kategorija + '?attr%5B158%5D%5B%5D=' + id : null;
}

/* ---------- įvestis ---------- */

function skaicius(tekstas){
  const t = String(tekstas).trim().replace(',', '.');
  if (t === '') return null;
  if (!/^\d+(\.\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}

function rodytiKlaida(laukas, tekstas){
  const blokas = document.querySelector('[data-laukas="' + laukas + '"]');
  const p = document.getElementById('klaida-' + laukas);
  if (blokas) blokas.classList.add('bloga');
  p.textContent = tekstas;
  p.hidden = false;
}

function valytiKlaidas(){
  document.querySelectorAll('.laukas').forEach(e => e.classList.remove('bloga'));
  document.querySelectorAll('.klaida').forEach(e => { e.hidden = true; e.textContent = ''; });
}

/* ---------- rezultatas ---------- */

/* Pastraipa, kurios viduje nurodyta frazė tampa nuoroda.
   Jei frazės tekste nėra, grąžinama paprasta pastraipa - tekstas nedingsta. */
function pastraipaSuNuoroda(tekstas, fraze, adresas){
  const p = el('p');
  const i = (fraze && adresas) ? tekstas.indexOf(fraze) : -1;
  if (i < 0) { p.textContent = tekstas; return p; }
  p.appendChild(document.createTextNode(tekstas.slice(0, i)));
  const a = el('a', null, fraze);
  a.href = adresas; a.target = '_blank'; a.rel = 'noopener';
  p.appendChild(a);
  p.appendChild(document.createTextNode(tekstas.slice(i + fraze.length)));
  return p;
}

function el(zyme, klase, tekstas){
  const e = document.createElement(zyme);
  if (klase) e.className = klase;
  if (tekstas != null) e.textContent = tekstas;
  return e;
}

function rodytiRezultata(dydis, juosta, kauselis){
  const sritis = document.getElementById('rezultatas');
  sritis.textContent = '';
  sritis.className = '';

  const a = el('div','atsakymas');
  a.appendChild(el('p','antraste', T.rezAntraste));
  const d = el('p','dydis', dydis);
  d.tabIndex = -1;
  a.appendChild(d);
  a.appendChild(el('p','nuo-kur', T.rezNuoKur));
  a.appendChild(el('p','smulkiau', T.rezSmulkiau));
  sritis.appendChild(a);

  const nuoroda = filtroNuoroda(dydis);
  if (nuoroda) {
    const cta = el('a','pagrindinis-cta', T.ctaPrekes(dydis));
    cta.href = nuoroda; cta.target = '_blank'; cta.rel = 'noopener';
    sritis.appendChild(cta);
  } else {
    const b = el('div','bloke');
    b.appendChild(el('p', null, T.nerastaDydzio));
    sritis.appendChild(b);
  }

  const maziau = seserinis(juosta, kauselis, -1);
  const daugiau = seserinis(juosta, kauselis, +1);
  if (maziau || daugiau) {
    const s = el('div','seseriniai');
    const p = el('p');
    p.appendChild(document.createTextNode(T.seseriniaiPradzia));
    [maziau, daugiau].filter(Boolean).forEach((x, i) => {
      if (i > 0) p.appendChild(document.createTextNode(T.seseriniaiArba));
      p.appendChild(el('strong', null, x));
    });
    p.appendChild(document.createTextNode('.'));
    s.appendChild(p);
    sritis.appendChild(s);
  }

  const kv = el('div','bloke');
  kv.appendChild(el('h2', null, T.kvietimasH2));
  kv.appendChild(pastraipaSuNuoroda(T.kvietimasP, T.kvietimasFraze, N.kontaktai));
  const regP = el('p', null, T.registracijaP);
  regP.style.marginTop = '12px';
  kv.appendChild(regP);
  const reg = el('a','antrinis-cta', T.registracijaCta);
  reg.href = N.registracija; reg.target = '_blank'; reg.rel = 'noopener';
  kv.appendChild(reg);
  sritis.appendChild(kv);

  sritis.appendChild(pradetiIsNaujo());
  sritis.hidden = false;
  perslinktiPrie(sritis, d);
}

/* Telefone rezultatas atsiranda už ekrano ribų, todėl prie jo perslenkame patys.
   Sklandus slinkimas čia nepatikimas, tad slenkame iš karto. */
function perslinktiPrie(sritis, fokusas){
  const y = sritis.getBoundingClientRect().top + window.scrollY - 12;
  window.scrollTo(0, Math.max(0, y));
  if (fokusas && fokusas.focus) fokusas.focus({ preventScroll: true });
}

function rodytiNepavyko(){
  const sritis = document.getElementById('rezultatas');
  sritis.textContent = '';
  sritis.className = 'nepavyko';

  const a = el('div','atsakymas');
  const h = el('p','antraste', T.nepavykoAntraste);
  h.tabIndex = -1;
  a.appendChild(h);
  a.appendChild(el('p','nuo-kur', T.nepavykoNuoKur));
  a.appendChild(el('p','smulkiau', T.nepavykoSmulkiau));
  sritis.appendChild(a);

  const kv = el('div','bloke');
  kv.appendChild(pastraipaSuNuoroda(T.nepavykoKvietimas, T.nepavykoFraze, N.kontaktai));
  const reg = el('a','antrinis-cta', T.registracijaCta);
  reg.href = N.registracija; reg.target = '_blank'; reg.rel = 'noopener';
  kv.appendChild(reg);
  sritis.appendChild(kv);

  sritis.appendChild(pradetiIsNaujo());
  sritis.hidden = false;
  perslinktiPrie(sritis, h);
}

function pradetiIsNaujo(){
  const m = el('div','mygtukai');
  m.style.marginTop = '24px';
  const b = el('button','mygtukas', T.isNaujo);
  b.type = 'button';
  b.style.background = 'transparent';
  b.style.border = '1.5px solid var(--konturas)';
  b.style.color = 'var(--tekstas)';
  b.style.fontWeight = '500';
  b.addEventListener('click', () => {
    document.getElementById('forma').reset();
    document.getElementById('rezultatas').hidden = true;
    valytiKlaidas();
    document.getElementById('po').focus();
    window.scrollTo({top:0, behavior:'smooth'});
  });
  m.appendChild(b);
  return m;
}

/* ---------- tekstų įrašymas ---------- */

function irasytiTekstus(){
  T = TEKSTAI[K]; N = NUORODOS[K];
  document.documentElement.lang = T.html;
  document.title = T.pavadinimas;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.content = T.meta;

  const p = {
    't-h1':T.h1, 't-santrauka':T.santrauka,
    't-po-label':T.poLabel, 't-po-kaip':T.poKaip, 't-po-1':T.po1, 't-po-2':T.po2,
    't-kr-label':T.krLabel, 't-kr-kaip':T.krKaip, 't-kr-1':T.kr1, 't-kr-2':T.kr2, 't-kr-3':T.kr3, 't-kr-antras':T.krAntras,
    't-skaiciuoti':T.skaiciuoti, 't-porastes-smulkiau':T.porasteSmulkiau
  };
  for (const id in p) { const e = document.getElementById(id); if (e) e.textContent = p[id]; }

  const isl = document.getElementById('t-islyga');
  isl.textContent = '';
  isl.appendChild(el('strong', null, T.islygaStiprus));
  isl.appendChild(document.createTextNode(T.islyga));

  document.getElementById('nuoroda-silueta').href = N.sveta;

  /* kalbų mygtukai */
  const nav = document.getElementById('kalbos');
  nav.textContent = '';
  for (const kodas of ['lt','en','ru']) {
    const b = el('button', null, kodas.toUpperCase());
    b.type = 'button';
    b.setAttribute('aria-current', kodas === K ? 'true' : 'false');
    b.addEventListener('click', () => {
      K = kodas;
      const u = new URL(location.href);
      u.searchParams.set('k', kodas);
      history.replaceState(null, '', u);
      document.getElementById('rezultatas').hidden = true;
      valytiKlaidas();
      irasytiTekstus();
    });
    nav.appendChild(b);
  }
}

/* ---------- forma ---------- */

document.getElementById('forma').addEventListener('submit', function(e){
  e.preventDefault();
  valytiKlaidas();
  document.getElementById('rezultatas').hidden = true;

  const po = skaicius(document.getElementById('po').value);
  const kr = skaicius(document.getElementById('krutine').value);
  let blogai = false;

  if (po === null)    { rodytiKlaida('po', T.klaidaPoTuscia); blogai = true; }
  else if (isNaN(po)) { rodytiKlaida('po', T.klaidaNeSkaicius); blogai = true; }

  if (kr === null)    { rodytiKlaida('krutine', T.klaidaKrTuscia); blogai = true; }
  else if (isNaN(kr)) { rodytiKlaida('krutine', T.klaidaNeSkaicius); blogai = true; }

  if (blogai) return;

  if (kr <= po) {
    const p = document.getElementById('klaida-bendra');
    p.textContent = T.klaidaBendra;
    p.hidden = false;
    return;
  }

  if (po < RIBOS.poMin || po > RIBOS.poMax || kr < RIBOS.krutineMin || kr > RIBOS.krutineMax) {
    rodytiNepavyko();
    siustiStatistika('uz ribu', { po: po, krutine: kr });
    return;
  }

  const skirtumas = Math.round((kr - po) * 10) / 10;
  const kauselis = kauselioDydis(skirtumas);
  const juosta = juostosDydis(po);

  if (!kauselis || JUOSTOS.indexOf(juosta) === -1) {
    rodytiNepavyko();
    siustiStatistika('uz ribu', { po: po, krutine: kr });
    return;
  }

  rodytiRezultata(juosta + kauselis, juosta, kauselis);
  siustiStatistika('dydis', { po: po, krutine: kr, dydis: juosta + kauselis, juosta: juosta, kauselis: kauselis });
});

irasytiTekstus();
</script>
