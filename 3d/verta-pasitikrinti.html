/* minkstas tamsus telkinys po zodziu - kad raides "atsisestu" ant grindu */
function telkinioTekstura(){
  const c = document.createElement('canvas'); c.width=c.height=512;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(256,256,0,256,256,256);
  gr.addColorStop(0.00,'rgba(22,4,4,0.62)');
  gr.addColorStop(0.45,'rgba(22,4,4,0.30)');
  gr.addColorStop(1.00,'rgba(22,4,4,0)');
  g.fillStyle=gr; g.fillRect(0,0,512,512);
  return new THREE.CanvasTexture(c);
}
const telkinys = new THREE.Mesh(
  new THREE.PlaneGeometry(PLOTIS*1.35, DYDIS*4.2),
  new THREE.MeshBasicMaterial({map:telkinioTekstura(), transparent:true, depthWrite:false})
);
telkinys.rotation.x = -Math.PI/2;
telkinys.position.set(0, GRINDYS_Y + 0.04, -DYDIS*0.35);
scene.add(telkinys);

virsutine.castShadow = true;

virsutine.shadow.radius = 4;

{

/* ---------- kadravimas: telpa ir 4:5, ir 9:16 ---------- */
function perpiesk(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w,h);
  camera.aspect = a;

  const tg = Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);
  const uzimaPlotyje = a < 0.7 ? 0.80 : 0.72;   // ilgam zodziui reikia daugiau oro
  const uzimaAukstyje = a < 0.7 ? 0.38 : 0.48;
  const dPlotis  = (PLOTIS /uzimaPlotyje)  / (2*tg*a);
  const dAukstis = (AUKSTIS/uzimaAukstyje) / (2*tg);
  const d = Math.max(dPlotis, dAukstis) + DYDIS*0.6;

  scene.fog = new THREE.Fog(FONAS, d*0.78, d*1.85);
  const zvilgsnis = new THREE.Vector3(0, AUKSTIS*0.04, 0);
  camera.position.set(0, GRINDYS_Y + AUKSTIS*0.34, d);   // siek tiek is apacios, bet virs grindu
  camera.lookAt(zvilgsnis);
  camera.updateProjectionMatrix();
  renderer.render(scene,camera);
}
addEventListener('resize',perpiesk);
perpiesk();
